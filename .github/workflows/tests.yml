name: Security and API regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight HTTP test dependency
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Compile Python sources
        run: python -m compileall -q chatgpt-app
      - name: Run security and HTTP regression suite (fake model, no network inference)
        run: python -m unittest discover -s chatgpt-app/tests -v
